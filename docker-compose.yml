services:
  mysql:
    image: mysql:8.0
    container_name: cinepass_mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-root}
      MYSQL_DATABASE: ${DB_NAME:-cinepass_db}
    ports:
      - "3306:3306"
    volumes:
      - cinepass_mysql_data:/var/lib/mysql
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: cinepass_redis
    ports:
      - "6379:6379"
    volumes:
      - cinepass_redis_data:/data
    restart: unless-stopped

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: cinepass_rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-guest}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASS:-guest}
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - cinepass_rabbitmq_data:/var/lib/rabbitmq
    restart: unless-stopped

volumes:
  cinepass_mysql_data:
  cinepass_redis_data:
  cinepass_rabbitmq_data: