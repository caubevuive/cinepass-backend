server:
  port: 8080

spring:
  application:
    name: cinepass

  datasource:
    url: jdbc:mysql://localhost:3306/${DB_NAME:cinepass_db}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Ho_Chi_Minh
    username: ${DB_USER:root}
    password: ${DB_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:guest}
    password: ${RABBITMQ_PASS:guest}

app:
  jwt:
    secret: ${JWT_SECRET:change-this-secret-key-in-environment-variables-minimum-32-chars}
    expiration-ms: 86400000
  seat-lock:
    ttl-seconds: 300